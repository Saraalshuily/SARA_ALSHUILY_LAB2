<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | My Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
  <script src="index.js" defer></script>
</head>
<body>
  <main class="feedback-page">
    <section class="feedback-card" aria-labelledby="feedback-heading">
      <h1 id="feedback-heading">My Portfolio Feedback</h1>
      <p class="intro">Tell me what you think. All fields are required except Website.</p>

      <form id="feedback-form" novalidate>

        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="fullName"
                 placeholder="e.g. Nora Smith"
                 autocomplete="name"
                 aria-describedby="full-name-error">
          <p class="error-message" id="full-name-error"></p>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email"
                 placeholder="e.g. nora@example.com"
                 autocomplete="email"
                 aria-describedby="email-error">
          <p class="error-message" id="email-error"></p>
        </div>

        <div class="form-group">
          <label for="topic">Topic of Interest</label>
          <select id="topic" name="topic" aria-describedby="topic-error">
            <option value="">Select a topic...</option>
            <option value="web-development">Web development</option>
            <option value="design">Design</option>
            <option value="collaboration">Collaboration</option>
            <option value="other">Other</option>
          </select>
          <p class="error-message" id="topic-error"></p>
        </div>

        <div class="form-group">
          <label for="comments">Comments</label>
          <textarea id="comments" name="comments" rows="5"
                    placeholder="Share your thoughts..."
                    aria-describedby="comments-counter comments-error"></textarea>
          <p class="char-counter" id="comments-counter">0 characters (minimum 15)</p>
          <p class="error-message" id="comments-error"></p>
        </div>

        <div class="form-group">
          <label for="website">Website (optional)</label>
          <input type="url" id="website" name="website"
                 placeholder="e.g. https://www.example.com"
                 autocomplete="url"
                 aria-describedby="website-error">
          <p class="error-message" id="website-error"></p>
        </div>

        <div class="button-row">
          <button type="submit" class="btn btn-primary">Submit</button>
          <button type="button" id="clear-button" class="btn btn-secondary">Clear</button>
        </div>

        <div id="form-status" class="form-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>
</body>
</html>
